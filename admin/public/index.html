function ServicesSection(){
  const PAGE_SIZE = 8;
  const totalSlides = Math.max(1, Math.ceil(SERVICES.length / PAGE_SIZE));
  const [activeSlide, setActiveSlide] = useState(0);
  const safeSlide = Math.min(activeSlide, totalSlides - 1);
  const start = safeSlide * PAGE_SIZE;
  const visibleServices = SERVICES.slice(start, start + PAGE_SIZE);
  const goPrev = () => setActiveSlide((current) => (current - 1 + totalSlides) % totalSlides);
  const goNext = () => setActiveSlide((current) => (current + 1) % totalSlides);

  useEffect(() => {
    if (activeSlide >= totalSlides) setActiveSlide(0);
  }, [activeSlide, totalSlides]);

  useEffect(() => {
    if (totalSlides <= 1) return undefined;
    const timer = setInterval(() => {
      setActiveSlide((current) => (current + 1) % totalSlides);
    }, 5000);
    return () => clearInterval(timer);
  }, [totalSlides]);

  return h('section',{style:{background:T.white,padding:'60px 24px 96px'}},
    h('div',{style:{maxWidth:1280,margin:'0 auto'}},
      h('div',{style:{textAlign:'center',marginBottom:48}},

        h('div',{style:{color:T.gray500,fontSize:13,fontWeight:600}},
          `Slide ${safeSlide + 1} of ${totalSlides}`

        h('div',{style:{display:'flex',gap:8}},
          h('button',{
            type:'button',
            onClick:goPrev,
            className:'btn-transition',
            disabled: totalSlides <= 1,
            style:{
              border:`2px solid ${T.yellow}`,background:'#fff',color:T.navy,
              borderRadius:10,padding:'7px 12px',fontWeight:800,cursor:'pointer',
              opacity: totalSlides <= 1 ? 0.5 : 1

          },'← Prev'),
          h('button',{
            type:'button',
            onClick:goNext,
            className:'btn-transition',
            disabled: totalSlides <= 1,

      h('div',{className:'services-grid',style:{

      }},
        ...visibleServices.map((svc,i)=>h('div',{key:`${safeSlide}-${i}`,className:'card-hover',style:{
          background:T.gray50,borderRadius:18,overflow:'hidden',cursor:'pointer',
          boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #e8edf2',

          h('div',{style:{background:T.navy,padding:'22px 20px 18px'}},

            h('s',{style:{color:'rgba(255,255,255,.25)'}},FOOTER_OFFER_WAS_PRICE),' ',FOOTER_OFFER_SAVE),
          h('div',{style:{color:'rgba(255,255,255,.4)',fontSize:11,marginTop:4}},FOOTER_OFFER_FEATURE),
          h('a',{href:'/mot-booking',className:'btn-transition',style:{
            marginTop:18,width:'100%',background:T.yellow,color:T.navy,
            border:'none',borderRadius:10,padding:'12px 0',
            fontWeight:800,fontSize:15,cursor:'pointer',display:'block',
            textAlign:'center',textDecoration:'none'}},FOOTER_OFFER_BTN),
          h('p',{style:{color:'rgba(255,255,255,.3)',fontSize:10,marginTop:10,lineHeight:1.4}},
            FOOTER_OFFER_DISCLAIMER)
        )
      )
    ),
    h('div',{style:{maxWidth:1280,margin:'48px auto 0',paddingTop:24,
      borderTop:'1px solid rgba(255,255,255,.08)',textAlign:'center'}},
      h('p',{style:{color:'#fff',fontSize:12,marginBottom:8}},
        COPYRIGHT_TEXT),
      h('p',{style:{marginTop:16,color:'#fff',fontSize:11}},
        'Site powered by ',
        h('a',{href:'https://cybercina.co.uk',target:'_blank',rel:'noopener noreferrer',style:{color:'#fff',textDecoration:'none',display:'inline-flex',alignItems:'center',gap:6,fontWeight:600}},
          h('img',{src:'https://cybercina.co.uk/wp-content/uploads/2025/10/cropped-2.png',alt:'Cybercina',loading:'lazy',decoding:'async',style:{height:22,width:'auto',verticalAlign:'middle'}})
        )
      )
    )
  );
}

function App(){
  const [scrolled,setScrolled]=useState(false);
  useEffect(()=>{
    const fn=()=>setScrolled(window.scrollY>60);
    window.addEventListener('scroll',fn,{passive:true});
    return ()=>window.removeEventListener('scroll',fn);
  },[]);
  return h('div',{style:{fontFamily:"'Instrument Sans',ui-sans-serif,system-ui,sans-serif"}},
    SHOW_UPDATE_NOTICE ? h('div',{style:{background:'#f59e0b',color:'#fff',textAlign:'center',padding:'10px 20px',fontSize:14,fontWeight:600}},
      '🔧 Site is under update — please be patient') : null,
    h(TopBar),
    h(Header,{scrolled}),
    h(HeroSection),
    h(TrustBar),
    h(CollectionBanner),
    h(ComboDeals),
    h(ServicesSection),
    h(BenefitsSection),
    h(FAQSection),
    h(CTABanner),
    h(Footer),
    h(MobileFAB),
    h(EmergencyCallButton),
  );
}

var rootEl = document.getElementById('root');
var reactRoot = null;
function doRender(){ try { if(!reactRoot&&window.ReactDOM&&window.React) reactRoot = ReactDOM.createRoot(rootEl); if(reactRoot) reactRoot.render(h(App)); } catch(e){ console.error('N05 render:',e); showErr(e.message||'Failed to render'); } }
/* First paint immediately (fallback shell + layout); second render after prices load */
doRender();
(async function init(){
  try {
    function fetchJson(url) {
      return fetch(url, { credentials: 'same-origin' }).then(function(r) { return r.ok ? r.json() : Promise.reject(); });
    }
    var load = window.N05ServicesLoader && N05ServicesLoader.loadServices
      ? N05ServicesLoader.loadServices()
      : fetchJson('/data/services.json?v=6');
    var data = await load.catch(function() { return { services: [], categories: {}, settings: {} }; });
    if (!data.services || data.services.length === 0) {
      var retry = await fetchJson('/data/services.json?t=' + Date.now()).catch(function() { return null; });
      if (retry && retry.services && retry.services.length) data = retry;
    }
    const settings = data.settings || {};
    function setMeta(name, value) {
      if (!value) return;
      var el = document.querySelector('meta[name="' + name + '"]');
      if (!el) {
        el = document.createElement('meta');
        el.setAttribute('name', name);
        document.head.appendChild(el);
      }
      el.setAttribute('content', value);
    }
    function setStructuredData(s) {
      var schema = {
        "@context": "https://schema.org",
        "@type": "AutoRepair",
        "name": SITE_NAME,
        "description": SITE_DESCRIPTION,
        "address": {
          "@type": "PostalAddress",
          "streetAddress": s.address_street || "6A Bourne Hill",
          "addressLocality": s.address_locality || "Palmers Green",
          "addressRegion": s.address_region || "",
          "postalCode": s.address_postcode || "N13 4LG",
          "addressCountry": s.address_country || "GB"
        },
        "telephone": PHONE_INTL,
        "url": s.url || window.location.origin,
        "image": HERO_IMAGE_URL,
        "logo": LOGO_URL,
        "openingHoursSpecification": [{
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": String(s.opening_days || "Monday,Tuesday,Wednesday,Thursday,Friday,Saturday").split(",").map(function(d){ return d.trim(); }).filter(Boolean),
          "opens": s.opening_time || "08:00",
          "closes": s.closing_time || "18:00"
        }],
        "priceRange": "££"
      };
      var el = document.querySelector('script[type="application/ld+json"]');
      if (el) el.textContent = JSON.stringify(schema);
    }
    if (settings.site_name && String(settings.site_name).trim()) SITE_NAME = String(settings.site_name).trim();
    if (settings.site_description && String(settings.site_description).trim()) SITE_DESCRIPTION = String(settings.site_description).trim();
    if (settings.seo_title && String(settings.seo_title).trim()) SEO_TITLE = String(settings.seo_title).trim();
    if (settings.seo_description && String(settings.seo_description).trim()) SEO_DESCRIPTION = String(settings.seo_description).trim();
    if (settings.seo_keywords && String(settings.seo_keywords).trim()) SEO_KEYWORDS = String(settings.seo_keywords).trim();
    if (settings.phone && String(settings.phone).trim()) PHONE = String(settings.phone).trim();
    if (settings.phone_international && String(settings.phone_international).trim()) PHONE_INTL = String(settings.phone_international).trim();
    PHONE_TEL = 'tel:' + PHONE_INTL;
    ADDRESS_LINE = [
      settings.address_street,
      settings.address_locality,
      settings.address_region,
      settings.address_postcode
    ].filter(function(v){ return v && String(v).trim(); }).join(', ') || ADDRESS_LINE;
    if (settings.footer_tagline && String(settings.footer_tagline).trim()) FOOTER_TAGLINE = String(settings.footer_tagline).trim();
    if (settings.footer_description && String(settings.footer_description).trim()) FOOTER_DESCRIPTION = String(settings.footer_description).trim();
    if (settings.copyright && String(settings.copyright).trim()) COPYRIGHT_TEXT = String(settings.copyright).trim();
    if (settings.hero_image_url && String(settings.hero_image_url).trim()) HERO_IMAGE_URL = String(settings.hero_image_url).trim();
    document.title = SEO_TITLE;
    setMeta('description', SEO_DESCRIPTION);
    setMeta('keywords', SEO_KEYWORDS);
    setStructuredData(settings);
    if (settings.opening_hours_display && String(settings.opening_hours_display).trim()) OPENING_HOURS_DISPLAY = String(settings.opening_hours_display).trim();
    if (settings.topbar_message && String(settings.topbar_message).trim()) TOPBAR_MESSAGE = String(settings.topbar_message).trim();
    if (settings.logo_url && String(settings.logo_url).trim()) LOGO_URL = String(settings.logo_url).trim();
    if (settings.tagline && String(settings.tagline).trim()) HEADER_TAGLINE = String(settings.tagline).trim();
    if (data.categories && data.categories['special-offers']) COMBO_SECTION_BADGE = data.categories['special-offers'].label;
    SHOW_UPDATE_NOTICE = (data.settings && data.settings.show_update_notice === '1');
    var s = data.settings || {};
    if (s.combo_section_title) COMBO_SECTION_TITLE = s.combo_section_title;
    if (s.combo_section_intro) COMBO_SECTION_INTRO = s.combo_section_intro;
    if (s.combo_combined_desc) COMBO_COMBINED_DESC = s.combo_combined_desc;
    if (s.footer_offer_title) FOOTER_OFFER_TITLE = s.footer_offer_title;
    if (s.footer_offer_subtitle) FOOTER_OFFER_SUBTITLE = s.footer_offer_subtitle;
    if (s.footer_offer_label) FOOTER_OFFER_LABEL = s.footer_offer_label;
    if (s.footer_offer_was_price) FOOTER_OFFER_WAS_PRICE = s.footer_offer_was_price;
    if (s.footer_offer_save) FOOTER_OFFER_SAVE = s.footer_offer_save;
    if (s.footer_offer_feature) FOOTER_OFFER_FEATURE = s.footer_offer_feature;
    if (s.footer_offer_btn || s.footer_offer_btn_text) FOOTER_OFFER_BTN = s.footer_offer_btn || s.footer_offer_btn_text;
    if (s.footer_offer_disclaimer) FOOTER_OFFER_DISCLAIMER = s.footer_offer_disclaimer;
    const map = (window.N05ServicesLoader && N05ServicesLoader.getPriceMap) ? N05ServicesLoader.getPriceMap(data) : { byValue:{}, byId:{} };
    const byId = map.byId || {};
    const byValue = map.byValue || {};
    var comboOfferIds = ['full-service-mot', 'major-service-mot'];
    var comboServices = comboOfferIds.map(function(oid){ return byId[oid]; }).filter(Boolean);
    COMBOS.length = 0;
    comboServices.forEach(function(svc){
      var ex = SERVICE_EXTRAS[svc.id] || {};
      COMBOS.push({
        id: svc.id,
        bookValue: svc.value || '',
        badge: svc.comboBadge || ex.badge || 'PACKAGE',
        title: svc.title,
        subtitle: svc.comboSubtitle || 'MOT + Service',
        includes: (svc.comboFeatures && svc.comboFeatures.length) ? svc.comboFeatures : (ex.features || []),
        price: (svc.comboDisplayPrice && String(svc.comboDisplayPrice).trim()) ? String(svc.comboDisplayPrice).trim() : (svc.priceDisplay || svc.priceLabel || ''),
        saving: svc.comboSaving || 'Bundle value',
        hot: !!svc.isComboHot || svc.id === 'full-service-mot'
      });
    });

    function parsePrice(v) {
      if (v == null || v === '') return null;
      if (typeof v === 'number' && !isNaN(v)) return v;
      const n = parseFloat(String(v).replace(/[£,\s]/g, ''));
      return isNaN(n) ? null : n;
    }
    function serviceDisplayPrice(svc) {
      if (!svc) return '';
      if (svc.priceDisplay && String(svc.priceDisplay).trim()) return String(svc.priceDisplay).trim();
      if (svc.priceLabel && String(svc.priceLabel).trim()) return String(svc.priceLabel).trim();
      var n = parsePrice(svc.price);
      return n != null ? ('£' + n) : '';
    }

    var s2 = data.settings || {};
    var combo = byId['full-service-mot'];
    var motTest = byId['mot-class-a'];
    var fullService = byId['full-service-only'];

    var comboDisplay = serviceDisplayPrice(combo);
    var comboNumber = parsePrice(comboDisplay);
    if (comboNumber == null) comboNumber = parsePrice(combo && combo.price);
    var motNumber = parsePrice(serviceDisplayPrice(motTest));
    if (motNumber == null) motNumber = parsePrice(motTest && motTest.price);
    var fullNumber = parsePrice(serviceDisplayPrice(fullService));
    if (fullNumber == null) fullNumber = parsePrice(fullService && fullService.price);

    var saveNumber = null;
    if (comboNumber != null && motNumber != null && fullNumber != null) {
      saveNumber = Math.round((fullNumber + motNumber) - comboNumber);
    } else if (comboNumber != null && motNumber != null) {
      saveNumber = Math.round(motNumber - comboNumber);
    }

    HERO_BOOK_PRICE = (s2.hero_book_price && String(s2.hero_book_price).trim())
      ? String(s2.hero_book_price).trim()
      : comboDisplay;
    if (HERO_BOOK_PRICE && /^[0-9]+(\.[0-9]+)?$/.test(HERO_BOOK_PRICE)) HERO_BOOK_PRICE = '£' + HERO_BOOK_PRICE;

    HERO_SAVE = (s2.hero_save && String(s2.hero_save).trim())
      ? String(s2.hero_save).trim()
      : (saveNumber != null && saveNumber > 0 ? ('£' + saveNumber) : '');
    FOOTER_MOT_PRICE = (s2.footer_mot_price && String(s2.footer_mot_price).trim()) ? String(s2.footer_mot_price).trim() : comboDisplay || '';
    if (combo && COMBOS.length) {
      STATS[0].value = FOOTER_MOT_PRICE || comboDisplay || '';
      STATS[0].sub = HERO_SAVE ? 'Save ' + HERO_SAVE + ' today' : '';
      for (var ci = 0; ci < COMBOS.length; ci++) {
        if (COMBOS[ci].id === 'full-service-mot') COMBOS[ci].price = comboDisplay || COMBOS[ci].price || STATS[0].value || '';
        if (COMBOS[ci].id === 'major-service-mot' && byId['major-service-mot']) {
          COMBOS[ci].price = serviceDisplayPrice(byId['major-service-mot']) || COMBOS[ci].price;
        }
      }
    }

    const catOrder = {
      'mot-testing': 1, 'servicing': 2, 'inspections-free': 3, 'tyres': 4,
      'engine-maintenance': 5, 'brakes': 6, 'diagnostics': 7, 'gearbox': 8,
      'electrical': 9, 'air-conditioning': 10, 'special-offers': 0
    };
    const list = (data.services || []).filter(function(s) {
      return s.id !== 'full-service-mot' && s.id !== 'major-service-mot';
    }).slice().sort(function(a, b) {
      return (catOrder[a.category] || 99) - (catOrder[b.category] || 99);
    });
    SERVICES.length = 0;
    list.forEach(function(s) {
      const ex = SERVICE_EXTRAS[s.id] || {};
      SERVICES.push({
        icon: s.icon || '📌',
        title: s.title,
        badge: ex.badge || (s.isQuote ? 'QUOTE' : '£' + s.price),
        desc: ex.desc || 'Professional ' + s.title + ' at competitive prices. Book online for North London.',
        features: (s.features && s.features.length) ? s.features : (ex.features || ['Free collection & delivery (1 mile max)', 'Expert technicians', 'Quality guaranteed']),
        price: s.priceLabel || s.priceDisplay || (s.isQuote ? 'Free Quote' : '£' + s.price)
      });
    });
  } catch(e){ console.error('N05 init:',e); }
  try { doRender(); } catch(e) { console.error('N05 render:', e); showErr(e.message || 'Failed to render app'); }
})();
})();
</script>
