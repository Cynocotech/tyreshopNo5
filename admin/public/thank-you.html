<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Booking Confirmed | Bourn Hill Tyre & MOT | London</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link href="/css/n05-styles.css?v=3" rel="stylesheet" />
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"AutoRepair","name":"Bourn Hill Tyre & MOT | London","description":"MOT testing, car servicing, tyre fitting in London.","address":{"@type":"PostalAddress","streetAddress":"6a Bourne Hill","addressLocality":"Palmers Green","addressRegion":"London","postalCode":"N13 4LG","addressCountry":"GB"},"telephone":"+447895859505","url":"https://no5tyreandmot.co.uk"}</script>
  <style>
    body { background:#111111; min-height:100vh; color:#fff; font-family:'Instrument Sans',sans-serif; margin:0; }
    .ty-wrap { max-width:620px; margin:0 auto; padding:48px 24px; text-align:center; }
    .ty-icon { width:72px; height:72px; background:#fede00; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:2rem; }
    .ty-wrap h1 { font-size:1.9rem; margin:0 0 10px; font-weight:900; }
    .ty-wrap .sub { color:rgba(255,255,255,.75); font-size:16px; margin-bottom:32px; line-height:1.6; }
    .info-card { background:rgba(255,255,255,.06); border-radius:16px; border:1px solid rgba(255,255,255,.12); padding:0; margin-bottom:20px; text-align:left; overflow:hidden; }
    .info-card-header { background:#fede00; padding:12px 20px; font-weight:800; font-size:13px; color:#111; letter-spacing:.06em; text-transform:uppercase; }
    .info-row { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid rgba(255,255,255,.08); gap:12px; }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:rgba(255,255,255,.55); font-size:13px; font-weight:600; flex-shrink:0; }
    .info-value { font-weight:700; font-size:15px; text-align:right; }
    .location-box { background:rgba(254,222,0,.1); border:1px solid rgba(254,222,0,.35); border-radius:14px; padding:20px 24px; margin-bottom:20px; text-align:left; }
    .location-box .addr { font-weight:700; font-size:15px; margin-bottom:6px; }
    .location-box .phone { font-weight:600; font-size:15px; margin-bottom:4px; }
    .location-box .hours { font-size:13px; color:rgba(255,255,255,.7); }
    .copy-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff; padding:14px 20px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:16px; transition:background .2s; font-family:inherit; }
    .copy-btn:hover { background:rgba(255,255,255,.14); }
    .copy-btn.copied { background:rgba(34,197,94,.2); border-color:rgba(34,197,94,.5); color:#86efac; }
    .btn-home { display:inline-block; background:#fede00; color:#111111; padding:16px 36px; border-radius:50px; font-weight:800; text-decoration:none; font-size:16px; }
    .btn-home:hover { opacity:.92; }
  </style>
</head>
<body>
<div class="ty-wrap">
  <div class="ty-icon">✓</div>
  <h1>Booking Confirmed!</h1>
  <p class="sub">Thank you — we've sent a confirmation email to your inbox. See you soon!</p>

  <div class="info-card">
    <div class="info-card-header">Your Booking Details</div>
    <div class="info-row">
      <span class="info-label">Booking Ref</span>
      <span class="info-value" id="ref">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Date & Time</span>
      <span class="info-value" id="datetime">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Service</span>
      <span class="info-value" id="service">—</span>
    </div>
  </div>

  <div class="location-box">
    <div class="addr">📍 <span id="site-address">6a Bourne Hill, Palmers Green, London N13 4LG</span></div>
    <div class="phone">📞 <span id="site-phone">+447895859505</span></div>
    <div class="hours">🕐 <span id="site-hours">Mon–Sat: 8am–7pm · Sun: 9:30am–4pm</span></div>
  </div>

  <button class="copy-btn" id="copy-btn" onclick="copyBookingDetails()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    Copy Booking Details
  </button>

  <a href="/" class="btn-home">Return to Home</a>
</div>

<script>
(function() {
  var p = new URLSearchParams(window.location.search);
  var ref     = p.get('booking') || p.get('ref') || '—';
  var date    = p.get('date') || '';
  var time    = p.get('time') || '';
  var service = p.get('service') ? decodeURIComponent(p.get('service')) : 'MOT / Service';
  var datetime = date && time ? date + ' at ' + time : (date || '—');

  document.getElementById('ref').textContent      = ref;
  document.getElementById('datetime').textContent = datetime;
  document.getElementById('service').textContent  = service;

  if (window.dataLayer && ref !== '—') {
    dataLayer.push({ event: 'booking_confirmation', booking_id: ref });
  }

  window.copyBookingDetails = function() {
    var addr  = document.getElementById('site-address').textContent;
    var phone = document.getElementById('site-phone').textContent;
    var hours = document.getElementById('site-hours').textContent;
    var text  = [
      'Bourn Hill Tyre & MOT — Booking Confirmed',
      '─────────────────────────────',
      'Booking Ref: ' + document.getElementById('ref').textContent,
      'Date & Time: ' + document.getElementById('datetime').textContent,
      'Service:     ' + document.getElementById('service').textContent,
      '─────────────────────────────',
      'Address: ' + addr,
      'Phone:   ' + phone,
      'Hours:   ' + hours,
    ].join('\n');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showCopied();
    }
  };

  function showCopied() {
    var btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied to clipboard!';
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy Booking Details';
    }, 3000);
  }
})();
</script>
<script src="js/services-loader.js"></script>
<script src="js/site-settings.js"></script>
<script>
// Update contact info from admin settings once site-settings.js loads
document.addEventListener('n05:settings', function(e) {
  var s = e.detail;
  if (s.address) document.getElementById('site-address').textContent = s.address;
  if (s.phone)   document.getElementById('site-phone').textContent   = s.phone;
  if (s.hours)   document.getElementById('site-hours').textContent   = s.hours;
});
</script>
</body>
</html>
